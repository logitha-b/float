safety_line: >-
  സുരക്ഷ: കടലിലേക്ക് പോകുന്നതിന് മുമ്പ് IMD, INCOIS എന്നിവയുടെ
  ഔദ്യോഗിക കാലാവസ്ഥ, തിരമാല, ചുഴലിക്കാറ്റ് മുന്നറിയിപ്പുകൾ
  നിർബന്ധമായും പരിശോധിക്കുക.

disclaimer: >-
  ഈ ഉപദേശം നിലവിലെ സമുദ്ര അവസ്ഥകൾ മാത്രം വിവരിക്കുന്നു.
  ഇത് മത്സ്യ സ്ഥാനങ്ങൾ പ്രവചിക്കുന്നില്ല, പിടിത്തം ഉറപ്പ് നൽകുന്നില്ല,
  അല്ലെങ്കിൽ ഏതെങ്കിലും യാത്ര സുരക്ഷിതമാണ് എന്ന് പ്രഖ്യാപിക്കുന്നില്ല.

