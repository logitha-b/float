  వల వేయడాన్ని ప్రభావితం చేయవచ్చు.

thermal_front_detected: >-
  {bearing}° దిశలో సుమారు {dist_km} కి.మీ దూరంలో {strength} ఉష్ణోగ్రత సరిహద్దు ఉంది.
  ఉష్ణోగ్రత సరిహద్దులు చేపలను ఆకర్షించవచ్చు.

thermal_front_nearby_offshore: >-
