unverified_coords_warning: >-
  മുന്നറിയിപ്പ്: ഈ തുറമുഖത്തിന്റെ കോർഡിനേറ്റുകൾ ഇതുവരെ
  സ്ഥിരീകരിക്കപ്പെട്ടിട്ടില്ല. താഴെയുള്ള എല്ലാ മൂല്യങ്ങളും
  സ്ഥിരീകരണം വരെ അസാധുവാണ്.

future_day_notice: >-
  ശ്രദ്ധ: നാളത്തെ അവസ്ഥകൾ ലഭ്യമായ ഏറ്റവും പുതിയ നിരീക്ഷണങ്ങളെ
  അടിസ്ഥാനമാക്കിയുള്ളതാണ്. SST മൂല്യങ്ങൾ നിരീക്ഷിക്കപ്പെട്ട ഡേറ്റ
  ആണ് (പ്രവചനമല്ല).

