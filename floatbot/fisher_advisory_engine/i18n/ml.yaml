warm_sst_anomaly_caution: >-
  കടൽ ഉപരിതല ഊഷ്മാവ് കാലിക ശരാശരിയേക്കാൾ {anomaly}°C കൂടുതലായിരിക്കാം
  (നിരീക്ഷിച്ചത്: {sst}°C). മത്സ്യങ്ങൾ സാധാരണത്തേക്കാൾ ആഴത്തിൽ
  ഉണ്ടായിരിക്കാം.

cool_sst_anomaly_info: >-
  കടൽ ഉപരിതല ഊഷ്മാവ് കാലിക ശരാശരിയേക്കാൾ {anomaly}°C കുറവായിരിക്കാം
  (നിരീക്ഷിച്ചത്: {sst}°C). തണുത്ത വെള്ളം ഉത്ഥാനത്തെ സൂചിപ്പിക്കാം.

heatwave_active: >-
  സമുദ്ര ഹീറ്റ്‌വേവ് സജീവമാണ്. ഉയർന്ന ഊഷ്മാവ് സമുദ്ര ജീവജാലങ്ങളുടെ
  പ്രവർത്തനത്തെ ബാധിക്കാം.

strong_current_caution: >-
  ഉപരിതല ഒഴുക്കിന്റെ വേഗത {speed} മീ/സെ വരെ എത്തിയേക്കാം. ശക്തമായ ഒഴുക്കുകൾ
  ഇന്ധന ഉപഭോഗത്തെയും നാവിഗേഷനെയും ബാധിക്കാം.

moderate_current_info: >-
  ഉപരിതല ഒഴുക്കിന്റെ വേഗത ഏകദേശം {speed} മീ/സെ ആണ്. മിതമായ ഒഴുക്കുകൾ
  വല ഇടുന്നതിനെ ബാധിക്കാം.

thermal_front_detected: >-
  {bearing}° ദിശയിൽ ഏകദേശം {dist_km} കി.മീ അകലെ {strength} ഊഷ്മാവ്
  അതിർത്തി ഉണ്ട്. ഊഷ്മാവ് അതിർത്തികൾ മത്സ്യങ്ങളെ ആകർഷിക്കാം.

thermal_front_nearby_offshore: >-
  ഏകദേശം {dist_km} കി.മീ അകലെ ഒരു ഊഷ്മാവ് അതിർത്തി ഉണ്ട്.

high_chlorophyll_info: >-
  ക്ലോറോഫിൽ അളവ് ഉയർന്നിരിക്കുന്നു, ഇത് ഉയർന്ന സമുദ്ര
  ഉൽപ്പാദനക്ഷമതയെ സൂചിപ്പിക്കുന്നു.

low_chlorophyll_info: >-
  ക്ലോറോഫിൽ അളവ് കുറവാണ്, ഇത് കുറഞ്ഞ സമുദ്ര ഉൽപ്പാദനക്ഷമതയെ
  സൂചിപ്പിക്കുന്നു.

chlorophyll_no_data: >-
  മേഘാവൃതം അല്ലെങ്കിൽ തീരദേശ മലിനീകരണം കാരണം ക്ലോറോഫിൽ
  ഡേറ്റ ലഭ്യമല്ല.

shallow_mld_info: >-
  സമുദ്രത്തിന്റെ മിശ്രിത പാളി ആഴം കുറഞ്ഞതായിരിക്കാം (ഏകദേശം {mld} മീറ്റർ).
  മത്സ്യങ്ങൾ ഉപരിതലത്തിനടുത്ത് കൂടുതലായി ഉണ്ടായിരിക്കാം.

deep_mld_warm_info: >-
  മിശ്രിത പാളി ആഴത്തിലുള്ളതായി തോന്നുന്നു (ഏകദേശം {mld} മീറ്റർ),
  {anomaly}°C ചൂടുള്ള വ്യതിയാനത്തോടൊപ്പം. മത്സ്യങ്ങൾ ആഴത്തിലുള്ള
  ജലത്തിൽ ഉണ്ടായിരിക്കാം.

offshore_shallow_water_info: >-
  ഈ സ്ഥലത്ത് കടലിന്റെ ആഴം ഏകദേശം {depth} മീറ്ററാണ്, ഇത്
  ആഴക്കടൽ യാത്രയ്ക്ക് താരതമ്യേന കുറഞ്ഞതാണ്.

no_data_label: "ഡേറ്റ ഇല്ല"
error_label: "പിശക്"

final_advisory_heading: "മൊത്തത്തിലുള്ള ഉപദേശം"

final_normal: >-
  {location} സമീപം നിലവിലെ കടൽ അവസ്ഥകൾ അനുസരിച്ച്, {trip_type}
  മത്സ്യബന്ധനത്തിന് കടൽ സാധാരണ കാലിക പരിധിക്കുള്ളിൽ ആണ്.
  അവസ്ഥകൾ നിരീക്ഷിക്കുകയും പുറപ്പെടുന്നതിന് മുമ്പ്
  IMD/INCOIS പരിശോധിക്കുകയും ചെയ്യുക.

final_warm_anomaly: >-
  {location} സമീപം കടൽ ഊഷ്മാവ് കാലിക ശരാശരിയേക്കാൾ ഉയർന്നിരിക്കുന്നു ({sst_c}°C).
  മത്സ്യങ്ങൾ സാധാരണത്തേക്കാൾ ആഴത്തിൽ ഉണ്ടായിരിക്കാം.
  പുറപ്പെടുന്നതിന് മുമ്പ് IMD/INCOIS പരിശോധിക്കുക.

final_heatwave: >-
  {location} സമീപം സമുദ്ര ഹീറ്റ്‌വേവ് സജീവമാണ് (കടൽ ഊഷ്മാവ് {sst_c}°C).
  ഉയർന്ന ഊഷ്മാവ് സമുദ്ര ജീവജാലങ്ങളെ ബാധിക്കാം.
  പുറപ്പെടുന്നതിന് മുമ്പ് IMD/INCOIS മുന്നറിയിപ്പുകൾ പരിശോധിക്കുക.

final_cool_anomaly: >-
  {location} സമീപം കടൽ ഊഷ്മാവ് കാലിക ശരാശരിയേക്കാൾ കുറഞ്ഞിരിക്കുന്നു ({sst_c}°C).
  ഇത് ഉത്ഥാന പ്രവർത്തനത്തെ സൂചിപ്പിക്കാം.
  പുറപ്പെടുന്നതിന് മുമ്പ് IMD/INCOIS പരിശോധിക്കുക.

final_no_sst: >-
  {location} സമീപം ഈ കാലഘട്ടത്തിൽ കടൽ ഡേറ്റ ലഭ്യമായില്ല.
  വിശ്വാസ്യത കുറവാണ്. ഈ ഉപദേശത്തെ മാത്രം ആശ്രയിക്കരുത് —
  IMD/INCOIS മുന്നറിയിപ്പുകൾ പരിശോധിക്കുക.

final_disclaimer_short: >-
  ഈ ഉപദേശം നിരീക്ഷിക്കപ്പെട്ട സമുദ്ര അവസ്ഥകൾ മാത്രം
  വിവരിക്കുന്നു. ഇത് മത്സ്യ സ്ഥാനങ്ങൾ പ്രവചിക്കുന്നില്ല.
