safety_line: >-
  భద్రత: సముద్రంలోకి వెళ్ళే ముందు IMD మరియు INCOIS యొక్క అధికారిక
  వాతావరణ, అలల మరియు తుఫాను హెచ్చరికలను తప్పకుండా తనిఖీ చేయండి.

disclaimer: >-
  ఈ సలహా ప్రస్తుత సముద్ర పరిస్థితులను మాత్రమే వివరిస్తుంది.
  ఇది చేపల స్థానాలను అంచనా వేయదు, పట్టుకున్న చేపలకు హామీ ఇవ్వదు,
  లేదా ఏ ప్రయాణాన్ని సురక్షితంగా ప్రకటించదు.

