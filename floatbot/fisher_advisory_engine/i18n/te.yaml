high_chlorophyll_info: >-
  క్లోరోఫిల్ స్థాయిలు అధికంగా ఉన్నాయి, ఇది అధిక సముద్ర ఉత్పాదకతను సూచిస్తుంది.

low_chlorophyll_info: >-
  క్లోరోఫిల్ స్థాయిలు తక్కువగా ఉన్నాయి, ఇది తక్కువ సముద్ర ఉత్పాదకతను సూచిస్తుంది.

chlorophyll_no_data: >-
  మేఘావృతం లేదా తీర గంధకం కారణంగా క్లోరోఫిల్ డేటా అందుబాటులో లేదు.

shallow_mld_info: >-
  సముద్రం యొక్క మిశ్రమ పొర లోతు తక్కువగా ఉండవచ్చు (సుమారు {mld} మీటర్లు).
  చేపలు ఉపరితలం దగ్గర అధికంగా ఉండవచ్చు.

deep_mld_warm_info: >-
  మిశ్రమ పొర లోతుగా కనిపిస్తోంది (సుమారు {mld} మీటర్లు), {anomaly}°C వేడి
  విచలనంతో. చేపలు లోతైన నీటిలో ఉండవచ్చు.

offshore_shallow_water_info: >-
  ఈ స్థానంలో సముద్ర గట్టు లోతు సుమారు {depth} మీటర్లు, ఇది లోతైన
  సముద్ర ప్రయాణానికి తక్కువగా ఉంది.

no_data_label: "డేటా లేదు"
error_label: "లోపం"

final_advisory_heading: "మొత్తం సలహా"

final_normal: >-
  {location} సమీపంలో ప్రస్తుత సముద్ర పరిస్థితుల ప్రకారం, {trip_type} మత్స్యకారుల కోసం
  సముద్రం సాధారణ కాలానుగుణ పరిధిలో ఉంది. పరిస్థితులను పర్యవేక్షించి
  బయలుదేరే ముందు IMD/INCOIS తనిఖీ చేయండి.

final_warm_anomaly: >-
  {location} సమీపంలో సముద్ర ఉష్ణోగ్రత కాలానుగుణ సగటు కంటే అధికంగా ఉంది ({sst_c}°C).
  చేపలు సాధారణం కంటే లోతులో ఉండవచ్చు. బయలుదేరే ముందు IMD/INCOIS తనిఖీ చేయండి.

final_heatwave: >-
  {location} సమీపంలో సముద్ర వేడి అల సక్రియంగా ఉంది (సముద్ర ఉష్ణోగ్రత {sst_c}°C).
  పెరిగిన ఉష్ణోగ్రతలు సముద్ర జీవులను ప్రభావితం చేయవచ్చు.
  బయలుదేరే ముందు IMD/INCOIS హెచ్చరికలు తనిఖీ చేయండి.

final_cool_anomaly: >-
  {location} సమీపంలో సముద్ర ఉష్ణోగ్రత కాలానుగుణ సగటు కంటే తక్కువగా ఉంది ({sst_c}°C).
  ఇది ఉత్ప్రేరణ కార్యకలాపాన్ని సూచించవచ్చు. బయలుదేరే ముందు IMD/INCOIS తనిఖీ చేయండి.

final_no_sst: >-
  {location} సమీపంలో ఈ కాలానికి సముద్ర డేటా అందుబాటులో లేదు.
  విశ్వసనీయత తక్కువ. ఈ సలహాపై మాత్రమే ఆధారపడవద్దు —
  IMD/INCOIS హెచ్చరికలు తనిఖీ చేయండి.

final_disclaimer_short: >-
  ఈ సలహా పరిశీలించిన సముద్ర పరిస్థితులను మాత్రమే వివరిస్తుంది.
  ఇది చేపల స్థానాలను అంచనా వేయదు.
