  ప్రవర్తనను ప్రభావితం చేయవచ్చు.

strong_current_caution: >-
  ఉపరితల ప్రవాహ వేగం {speed} మీ/సె వరకు చేరవచ్చు. బలమైన ప్రవాహాలు
  ఇంధన వినియోగాన్ని మరియు నావిగేషన్‌ను ప్రభావితం చేయవచ్చు.

moderate_current_info: >-
